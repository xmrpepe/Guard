name: Release

# Pushing a tag such as v1.0.0 or v1.0.0-beta.1 builds, tests, signs and
# publishes a GitHub release. Tags with a hyphen are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if [[ "v${VERSION}" != "${TAG}" ]]; then
            echo "::error::Tag ${TAG} does not match versionName ${VERSION} in app/build.gradle.kts"
            exit 1
          fi

      - name: Test, lint and build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Sign
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          ./scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "dist/RocksGuard-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "RocksGuard-${GITHUB_REF_NAME}.apk" > "RocksGuard-${GITHUB_REF_NAME}.apk.sha256")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="dist/RocksGuard-${TAG}.apk"
          source "${APK}.signing"
          NOTES="docs/releases/${TAG}.md"
          [[ -f "$NOTES" ]] || { echo "Release ${TAG}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          cp "$NOTES" /tmp/final-notes.md
          {
            echo
            echo "---"
            echo "**APK SHA-256:** \`$(cut -d' ' -f1 "${APK}.sha256")\`  "
            echo "**Signing certificate SHA-256:** \`${cert_sha256}\`"
            if [[ "$signing" == "one-off" ]]; then
              echo
              echo "> This build is signed with a one-off key created for this build only. A later release signed with the permanent key will need this one uninstalled first."
            fi
          } >> /tmp/final-notes.md
          PRE=""
          [[ "$TAG" == *-* ]] && PRE="--prerelease"
          gh release create "$TAG" "$APK" "${APK}.sha256" \
            --title "RocksGuard ${TAG#v}" --notes-file /tmp/final-notes.md $PRE --verify-tag
