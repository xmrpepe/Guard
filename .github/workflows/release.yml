name: Release

# Builds, tests, signs and publishes a GitHub release. Either push a tag such
# as v1.0.0-beta.1, or run it manually ("Run workflow"): the tag is then made
# from versionName in app/build.gradle.kts and created on the built commit.
# Versions with a hyphen (beta, rc) are marked as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Work out the release tag
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "v${VERSION}" != "${TAG}" ]]; then
              echo "::error::Tag ${TAG} does not match versionName ${VERSION} in app/build.gradle.kts"
              exit 1
            fi
          else
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
              echo "::error::${TAG} already exists. Bump versionName before releasing again."
              exit 1
            fi
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Test, lint and build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Sign
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          ./scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "dist/RocksGuard-${TAG}.apk"
          (cd dist && sha256sum "RocksGuard-${TAG}.apk" > "RocksGuard-${TAG}.apk.sha256")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/RocksGuard-${TAG}.apk"
          source "${APK}.signing"
          NOTES="docs/releases/${TAG}.md"
          [[ -f "$NOTES" ]] || { echo "Release ${TAG}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          cp "$NOTES" /tmp/final-notes.md
          {
            echo
            echo "---"
            echo "**APK SHA-256:** \`$(cut -d' ' -f1 "${APK}.sha256")\`  "
            echo "**Signing certificate SHA-256:** \`${cert_sha256}\`"
            if [[ "$signing" == "one-off" ]]; then
              echo
              echo "> This build is signed with a one-off key created for this build only. A later release signed with the permanent key will need this one uninstalled first."
            fi
          } >> /tmp/final-notes.md
          PRE=""
          [[ "$TAG" == *-* ]] && PRE="--prerelease"
          gh release create "$TAG" "$APK" "${APK}.sha256" \
            --title "RocksGuard ${TAG#v}" --notes-file /tmp/final-notes.md $PRE --target "${GITHUB_SHA}"
